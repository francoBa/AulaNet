{% extends "layouts/general-layout.html" %}
{% block title %}Registro{% endblock %}

{% block page_content %}
<div class="min-h-screen flex items-center justify-center bg-gray-50 dark:bg-gray-900 px-4">

  <div class="w-full max-w-md bg-white dark:bg-slate-800 p-8 rounded-2xl shadow-lg">
    <h2 class="text-3xl font-bold text-center text-gray-800 dark:text-gray-100 mb-6">
      Crear tu cuenta en <span class="text-blue-600">AulaNet</span>
    </h2>

    <form method="POST" class="space-y-5">
      {% csrf_token %}

      <div>
        <label class="block text-gray-700 dark:text-gray-200 font-medium mb-1">Nombre de usuario</label>
        <input type="text" name="username"
               class="w-full border-gray-300 dark:border-gray-600 rounded-lg focus:ring-blue-500 focus:border-blue-500 px-3 py-2 bg-white dark:bg-slate-700 text-gray-800 dark:text-gray-100" required>
      </div>

      <div>
        <label class="block text-gray-700 dark:text-gray-200 font-medium mb-1">Email</label>
        <input type="email" name="email"
               class="w-full border-gray-300 dark:border-gray-600 rounded-lg focus:ring-blue-500 focus:border-blue-500 px-3 py-2 bg-white dark:bg-slate-700 text-gray-800 dark:text-gray-100" required>
      </div>

      <div>
        <label class="block text-gray-700 dark:text-gray-200 font-medium mb-1">Contraseña</label>
        <input type="password" name="password1"
               class="w-full border-gray-300 dark:border-gray-600 rounded-lg focus:ring-blue-500 focus:border-blue-500 px-3 py-2 bg-white dark:bg-slate-700 text-gray-800 dark:text-gray-100" required>
      </div>

      <div>
        <label class="block text-gray-700 dark:text-gray-200 font-medium mb-1">Confirmar Contraseña</label>
        <input type="password" name="password2"
               class="w-full border-gray-300 dark:border-gray-600 rounded-lg focus:ring-blue-500 focus:border-blue-500 px-3 py-2 bg-white dark:bg-slate-700 text-gray-800 dark:text-gray-100" required>
      </div>

      <button class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg font-semibold transition">
        Registrarse
      </button>

      <p class="text-center text-gray-600 dark:text-gray-300 text-sm mt-3">
        ¿Ya tienes cuenta?
        <a href="{% url 'user:login' %}" class="text-blue-600 hover:underline">Inicia sesión aquí</a>
      </p>
    </form>
  </div>

</div>
{% endblock page_content %}
