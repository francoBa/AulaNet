{% extends 'layouts/general-layout.html' %}

{% block title %} {{ school.name }} {% endblock %}

{% block page_content %}
<section class="max-w-5xl mx-auto px-4 py-10">

  <h1 class="text-3xl font-main font-bold text-[var(--color-main)] mb-4">
    {{ school.name }}
  </h1>

  <p class="text-gray-600 dark:text-gray-300 font-secondary mb-6">
    {{ school.city }}
  </p>

  {% if school.image %}
  <img src="{{ school.image.url }}" class="w-full rounded-xl shadow-lg mb-8" />
  {% endif %}

  {% if school.description %}
  <p class="text-gray-700 dark:text-gray-300 font-secondary leading-relaxed">
    {{ school.description }}
  </p>
  {% endif %}

  <div class="mt-8">
    <a href="{% url 'school:school-list' %}"
       class="text-[var(--color-secondary)] underline">
      ← Volver al listado
    </a>
  </div>

</section>
{% endblock %}
