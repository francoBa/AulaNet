<!-- prettier-ignore -->
{% extends 'layouts/general-layout.html' %}

{% block title %}Eliminar Comentario{% endblock %}

{% block page_content %}
<div class="max-w-md mx-auto py-10 px-4">
  <div
    class="bg-white dark:bg-slate-800 p-6 rounded-lg shadow border border-red-200 dark:border-red-900 text-center"
  >
    <h2 class="text-xl font-bold mb-2 text-red-600">¿Eliminar Comentario?</h2>
    <p class="text-gray-600 dark:text-gray-300 mb-6">
      "{{ object.content|truncatechars:50 }}"
    </p>

    <form method="post">
      {% csrf_token %}
      <div class="flex justify-center gap-3">
        <button
          type="submit"
          class="px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700"
        >
          Sí, eliminar
        </button>
        <a
          href="javascript:history.back()"
          class="px-4 py-2 bg-gray-200 text-gray-700 rounded hover:bg-gray-300"
        >
          Cancelar
        </a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
