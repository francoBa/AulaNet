<!-- prettier-ignore -->
{% extends 'layouts/general-layout.html' %}

{% block title %}Gestionar Comentario{% endblock %}

{% block page_content %}
<div class="max-w-md mx-auto py-10 px-4">
  <div
    class="bg-white dark:bg-slate-800 p-6 rounded-lg shadow border border-gray-200 dark:border-slate-700"
  >
    <h2 class="text-xl font-bold mb-4 dark:text-white">
      {% if form.instance.pk %}Editar Comentario{% else %}Nuevo Comentario{%
      endif %}
    </h2>

    <form method="post">
      {% csrf_token %} {{ form.as_p }}

      <div class="flex gap-3 mt-6">
        <button
          type="submit"
          class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700"
        >
          Guardar
        </button>
        <!-- Botón para volver atrás js -->
        <a
          href="javascript:history.back()"
          class="px-4 py-2 bg-gray-200 text-gray-700 rounded hover:bg-gray-300"
        >
          Cancelar
        </a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
