{% load static %}

<html lang="en">

    <link
      rel="shortcut icon"
      href="{% static 'favicon.ico' %}"
      type="image/x-icon"
    />
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"

  <body>
    <!-- prettier-ignore -->
    {% block content_layout %} {% endblock content_layout %}
    {% include 'components/includes/footer.html' %}

</html>
