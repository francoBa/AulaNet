<!-- prettier-ignore -->
{% extends "components/includes/base.html" %}
{% load static %}

{% block header %}
<div class="absolute top-6 left-6 z-50">
  <a
    href="{% url 'core:index' %}"
    class="flex items-center gap-2 text-gray-600 dark:text-gray-300 hover:text-blue-600 dark:hover:text-blue-400 transition font-medium"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      fill="none"
      viewBox="0 0 24 24"
      stroke-width="2"
      stroke="currentColor"
      class="w-5 h-5"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18"
      />
    </svg>
    Volver al inicio
  </a>
</div>

<div class="absolute top-6 right-6 z-50">
  <button
    id="themeToggle"
    class="p-2 rounded-full bg-gray-200 dark:bg-slate-700 text-gray-700 dark:text-gray-200 hover:bg-gray-300 dark:hover:bg-slate-600 transition"
  >
    🌓
  </button>
</div>
<!-- prettier-ignore -->
{% endblock %}

{% block content %}
<div
  class="min-h-screen flex flex-col items-center justify-center bg-gray-100 dark:bg-[#0f172a] p-4"
>
  <div class="mb-8">
    <a href="{% url 'core:index' %}">
      <img
        src="{% static 'img/logo-rombo-amarillo.png' %}"
        alt="AulaNet"
        class="h-16 w-auto drop-shadow-lg"
      />
    </a>
  </div>

  {% block page_content %}{% endblock %}

  <div class="mt-8 text-center text-sm text-gray-400 dark:text-gray-500">
    &copy; {% now "Y" %} AulaNet. Todos los derechos reservados.
  </div>
</div>
<!-- prettier-ignore -->
{% endblock %}

{% block footer %}
{% endblock %}
