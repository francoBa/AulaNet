<nav class="max-w-6xl mx-auto px-4 py-3">
  <div class="grid grid-cols-3 items-center">
    <!-- LOGO -->
    <div class="flex items-center space-x-3">
      <span class="text-xl font-bold">AulaNet</span>
    </div>

    <!-- MENU DESKTOP -->
    <div class="hidden md:flex justify-center space-x-6">
      <a href="/" class="hover:text-blue-500">Home</a>
      <a href="/colegios/" class="hover:text-blue-500">Colegios</a>
      <a href="/posts/" class="hover:text-blue-500">Posts</a>
      <a href="/contacto/" class="hover:text-blue-500">Contacto</a>
    </div>

    <!-- LADO DERECHO (login + tema) -->
    <div class="hidden md:flex items-center justify-end space-x-3">
      <!-- BOTÓN DARK MODE -->
      <button
        id="themeToggle"
        class="px-2 py-1 border rounded dark:border-gray-500"
      >
        🌓
      </button>

      <!-- LOGIN -->
      <a
        href="/login/"
        class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700"
      >
        Login
      </a>
    </div>

    <!-- BOTÓN MOBILE MENU -->
    <button
      id="navToggle"
      class="md:hidden justify-self-end px-2 py-1 border rounded dark:border-gray-500"
    >
      ☰
    </button>
  </div>

  <!-- MENU MOBILE -->
  <div id="mobileMenu" class="hidden flex-col mt-3 space-y-2 md:hidden">
    <!-- SWITCH TEMA MOBILE -->
    <button
      id="themeToggleMobile"
      class="w-full py-2 border rounded dark:border-gray-500 text-center"
    >
      🌓 Tema
    </button>

    <a href="/" class="block py-2 border-b dark:border-gray-600">Home</a>
    <a href="/colegios/" class="block py-2 border-b dark:border-gray-600"
      >Colegios</a
    >
    <a href="/posts/" class="block py-2 border-b dark:border-gray-600">Posts</a>
    <a href="/contacto/" class="block py-2 border-b dark:border-gray-600"
      >Contacto</a
    >

    <a
      href="/login/"
      class="block py-2 bg-blue-600 text-white text-center rounded hover:bg-blue-700"
    >
      Login
    </a>
  </div>

  <!-- SCRIPT: MOBILE + DARK MODE -->
  <script>
    // --- MOBILE MENU ---
    document.getElementById('navToggle').onclick = () => {
      const menu = document.getElementById('mobileMenu');
      menu.classList.toggle('hidden');
    };

    // --- DARK MODE ---
    const root = document.documentElement;

    function toggleTheme() {
      const isDark = root.classList.toggle('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    }

    document.getElementById('themeToggle').onclick = toggleTheme;
    document.getElementById('themeToggleMobile').onclick = toggleTheme;

    // Cargar tema guardado
    if (localStorage.getItem('theme') === 'dark') {
      root.classList.add('dark');
    }
  </script>
</nav>
