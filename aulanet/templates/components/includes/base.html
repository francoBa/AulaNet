{% load static %}
<!DOCTYPE html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}AulaNet{% endblock %}</title>
    <!-- Favicon -->
    <link
      rel="shortcut icon"
      href="{% static 'favicon.png' %}"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="{% static 'js/config.js' %}"></script>
    <script defer src="{% static 'js/main.js' %}"></script>
  </head>

  <body
    class="bg-[var(--bg-main)] dark:bg-[var(--bg-main)] text-[var(--color-main)] dark:text-[var(--color-main)]"
  >
    <div class="layout-grid">
      <!-- prettier-ignore -->
      {% block header %} 
        {% include "components/includes/header.html" %}
      {% endblock %}

      <main>{% block content %} {% endblock %}</main>
      <!-- prettier-ignore -->
      {% block footer %}
        {% include "components/includes/footer.html" %}
      {% endblock %}
    </div>
  </body>
</html>
